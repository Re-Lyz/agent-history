name: Windows and Linux contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xterm
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tests/linux_check.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tests/linux_terminal_check.py /usr/bin/xterm
      - if: runner.os == 'Linux'
        name: Real systemd timer in disposable user
        shell: bash
        run: |
          set -euo pipefail
          task_user=agent-history-validation
          sudo useradd --create-home --shell /bin/bash "$task_user"
          task_uid=$(id -u "$task_user")
          sudo loginctl enable-linger "$task_user"
          sudo systemctl start "user@${task_uid}.service"
          task_root=/home/$task_user/source
          sudo mkdir "$task_root"
          sudo cp -a . "$task_root/"
          sudo chown -R "$task_user:$task_user" "$task_root"
          sudo -u "$task_user" env HOME="/home/$task_user" XDG_RUNTIME_DIR="/run/user/$task_uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$task_uid/bus" AGENT_HISTORY_DISPOSABLE_USER=1 \
            "$(command -v python)" "$task_root/tests/systemd_check.py"
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -q
      - run: python tests/release_audit.py --output dist/content-audit.json
      - run: python integrations/build_portable.py --output dist/agent-history-0.1.0-beta.1.zip
      - run: python tests/portable_check.py dist/agent-history-0.1.0-beta.1.zip
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tests/first_use_check.py dist/agent-history-0.1.0-beta.1.zip
      - if: runner.os == 'Windows'
        run: python tests/first_use_check.py dist/agent-history-0.1.0-beta.1.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @openai/codex@0.159.2
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import subprocess,sys; [subprocess.run([sys.executable,'tests/'+name+'.py'],check=True) for name in ('verify_ui_resume','verify_claude_to_codex','verify_handoff','verify_temporary_handoff','verify_single_conversation','verify_resume_switch')]"
      - if: runner.os == 'Windows'
        run: python -c "import subprocess,sys; [subprocess.run([sys.executable,'tests/'+name+'.py'],check=True) for name in ('verify_ui_resume','verify_claude_to_codex','verify_handoff','verify_temporary_handoff','verify_single_conversation','verify_resume_switch')]"
      - run: python tests/release_audit.py --artifact dist/agent-history-0.1.0-beta.1.zip --output dist/content-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: beta-source-${{ matrix.os }}
          path: |
            dist/agent-history-0.1.0-beta.1.zip
            dist/agent-history-0.1.0-beta.1.zip.sha256
            dist/content-audit.json
          if-no-files-found: error
